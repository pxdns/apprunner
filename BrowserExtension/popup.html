<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>AppRunner Quick Actions</title>
  <style>
    body {
      width: 260px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #1c1c1e;
      color: #f2f2f2;
      margin: 0;
      padding: 14px;
    }
    h1 { font-size: 13px; margin: 0 0 10px; font-weight: 600; }
    .row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .action-row { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; }
    input[type="text"] {
      flex: 1;
      background: #2c2c2e;
      border: 1px solid rgba(255,255,255,0.15);
      color: #fff;
      border-radius: 6px;
      padding: 5px 7px;
      font-size: 12px;
    }
    button.icon {
      background: none;
      border: none;
      color: #f2f2f2;
      cursor: pointer;
      font-size: 13px;
    }
    button.add {
      width: 100%;
      margin-top: 6px;
      padding: 6px;
      border-radius: 6px;
      border: 1px dashed rgba(255,255,255,0.25);
      background: none;
      color: #f2f2f2;
      cursor: pointer;
      font-size: 12px;
    }
    .hint { font-size: 10px; color: #9a9a9e; margin-top: 8px; line-height: 1.4; }
  </style>
</head>
<body>
  <div class="row">
    <h1>Floating quick-actions icon</h1>
    <label>
      <input type="checkbox" id="enabled-toggle" />
    </label>
  </div>

  <div id="actions-list"></div>
  <button class="add" id="add-action">+ Add action</button>

  <p class="hint">
    "Send page to assistant" copies the current page's text and drops it
    into whatever ChatGPT/Claude/Gemini window is open — open one first via
    the icon's menu, then log in there normally.
  </p>

  <script src="popup.js"></script>
</body>
</html>
